<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InkGuard – Check your copy before it ships</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fffaf3;
    --ink: #3a2a22;
    --accent: #f08a24;
    --muted: #6b6f8a;
    --card-shadow: 0 10px 30px rgba(58, 42, 34, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header {
    position: relative; z-index: 5;
    max-width: 1280px; margin: 0 auto;
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo svg { width: 44px; height: 44px; }
  .logo-text { font-family: "Outfit", sans-serif; font-size: 30px; font-weight: 700; line-height: 1; }
  .logo-sub { display: block; font-family: "DM Sans"; font-size: 9px; letter-spacing: 0.18em; color: var(--ink); margin-top: 4px; font-weight: 500; }
  nav { display: flex; gap: 32px; font-size: 14px; font-weight: 500; }
  nav a:hover { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .icon-btn { position: relative; display: grid; place-items: center; width: 36px; height: 36px; background: none; border: 0; cursor: pointer; }
  .badge { position: absolute; top: -4px; right: -10px; font-size: 10px; color: #2f6fed; background: #e6efff; border-radius: 50%; width: 18px; height: 18px; display: grid; place-items: center; }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 14px 28px; border: 1px solid var(--ink); border-radius: 999px;
    font-size: 13px; font-weight: 500; transition: .2s;
  }
  .btn-outline:hover { background: var(--ink); color: #fff; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; max-width: 1280px; margin: 0 auto;
    min-height: 820px; padding: 0 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.3em; font-weight: 500; margin-bottom: 28px; }
  .sun { width: 64px; height: 48px; margin-bottom: 8px; }
  h1 { font-family: "Outfit", sans-serif; font-weight: 700; font-size: clamp(48px, 8vw, 104px); line-height: 1; letter-spacing: -0.04em; }
  h1 .accent { color: var(--accent); display: block; }
  .sub { margin-top: 28px; font-size: 14px; line-height: 1.9; color: var(--muted); max-width: 420px; }
  .btn-primary {
    margin-top: 32px; display: inline-flex; align-items: center; gap: 14px;
    background: var(--accent); color: #fff; padding: 18px 36px; border-radius: 999px;
    font-size: 14px; font-weight: 500; transition: .2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(240,138,36,.4); }

  /* ---------- Tilted cards ---------- */
  .card {
    position: absolute; background: #fff; border-radius: 6px; padding: 10px 10px 0;
    box-shadow: var(--card-shadow); transition: transform .3s;
  }
  .card:hover { transform: rotate(0deg) scale(1.03) !important; z-index: 3; }
  .card .art { border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
  .card .art svg { width: 100%; height: 100%; display: block; }
  .card .cap { font-size: 9px; letter-spacing: 0.2em; font-weight: 500; text-transform: uppercase; padding: 10px 2px; color: var(--ink); }

  .c1 { left: 40px;  top: 90px;  width: 340px; transform: rotate(-5deg); }
  .c1 .art { height: 330px; background: linear-gradient(160deg,#ffe3b8,#ffc27a); }
  .c2 { left: 36%;   top: -20px; width: 330px; transform: rotate(3deg); padding-bottom: 10px; }
  .c2 .art { height: 140px; background: linear-gradient(160deg,#d9efe3,#a9d9bf); }
  .c3 { right: 40px; top: 20px;  width: 330px; transform: rotate(4deg); }
  .c3 .art { height: 300px; background: linear-gradient(160deg,#fff0cf,#ffd98a); }
  .c4 { left: 150px; bottom: -40px; width: 310px; transform: rotate(-3deg); }
  .c4 .art { height: 220px; background: linear-gradient(160deg,#dfe8ff,#b4c9ff); }
  .c5 { right: 60px; bottom: -50px; width: 290px; transform: rotate(-2deg); }
  .c5 .art { height: 260px; background: linear-gradient(160deg,#fde0e6,#f9b3c2); }

  /* ---------- Sticky bottom bar (optional) ---------- */
  .template-bar { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    nav { display: none; }
    .card { width: 220px !important; }
    .c1 .art { height: 200px; } .c3 .art { height: 190px; } .c4 .art { height: 150px; } .c5 .art { height: 170px; } .c2 .art { height: 100px; }
    .c1 { left: 0; } .c3 { right: 0; } .c4 { left: 40px; } .c5 { right: 20px; }
  }
  @media (max-width: 700px) {
    .card { display: none; }
    .hero { min-height: 600px; }
    .btn-outline { display: none; }
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <a href="#" class="logo">
    <!-- Replace with your own logo -->
    <svg viewBox="0 0 48 48" fill="none" stroke="#f08a24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 6h17l9 9v27H12z" />
      <path d="M29 6v9h9" />
      <path d="M18 24h14M18 30h14M18 36h8" />
    </svg>
    <span>
      <span class="logo-text">inkguard</span>
      <span class="logo-sub">BRAND &amp; COPY CHECKER</span>
    </span>
  </a>

  <nav>
    <a href="#">Check text</a>
    <a href="#">Rules</a>
    <a href="#">Submissions</a>
    <a href="#">Audit trail</a>
    <a href="#">Insights</a>
  </nav>

  <div class="header-right">
    <button class="icon-btn" aria-label="Notifications">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0" />
      </svg>
      <span class="badge">0</span>
    </button>
    <a href="#" class="btn-outline">New submission
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10 10 2M4 2h6v6"/></svg>
    </a>
  </div>
</header>

<!-- ============ HERO ============ -->
<main class="hero">

  <!-- Card 1: Document -->
  <figure class="card c1">
    <div class="art">
      <svg viewBox="0 0 200 200">
        <rect x="52" y="24" width="96" height="132" rx="8" fill="#fff" />
        <path d="M118 24v28h30" fill="#ffe3b8" stroke="#f08a24" stroke-width="3" stroke-linejoin="round"/>
        <rect x="52" y="24" width="96" height="132" rx="8" fill="none" stroke="#f08a24" stroke-width="4"/>
        <rect x="66" y="66" width="68" height="6" rx="3" fill="#f08a24"/>
        <rect x="66" y="82" width="68" height="6" rx="3" fill="#f6b873"/>
        <rect x="66" y="98" width="52" height="6" rx="3" fill="#f6b873"/>
        <rect x="66" y="114" width="64" height="6" rx="3" fill="#f6b873"/>
        <rect x="66" y="130" width="40" height="6" rx="3" fill="#f6b873"/>
        <circle cx="150" cy="150" r="22" fill="#f08a24"/>
        <path d="M141 150l7 7 12-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <figcaption class="cap">Rules, organised</figcaption>
  </figure>

  <!-- Card 2: Folder -->
  <figure class="card c2">
    <div class="art">
      <svg viewBox="0 0 330 140" preserveAspectRatio="xMidYMid meet">
        <g transform="translate(95 20)">
          <path d="M0 20a8 8 0 0 1 8-8h42l12 14h90a8 8 0 0 1 8 8v70a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#5fb88a"/>
          <rect x="14" y="30" width="120" height="70" rx="4" fill="#fff" transform="rotate(-4 74 65)"/>
          <rect x="22" y="42" width="60" height="5" rx="2.5" fill="#a9d9bf" transform="rotate(-4 74 65)"/>
          <rect x="22" y="54" width="90" height="5" rx="2.5" fill="#d9efe3" transform="rotate(-4 74 65)"/>
          <path d="M0 48a8 8 0 0 1 8-8h142a8 8 0 0 1 8 8v52a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8z" fill="#3f9b6d"/>
        </g>
      </svg>
    </div>
  </figure>

  <!-- Card 3: Spreadsheet -->
  <figure class="card c3">
    <div class="art">
      <svg viewBox="0 0 220 200">
        <rect x="30" y="30" width="160" height="130" rx="8" fill="#fff" stroke="#f0a824" stroke-width="4"/>
        <rect x="30" y="30" width="160" height="26" rx="8" fill="#f0a824"/>
        <g stroke="#f6c76a" stroke-width="2">
          <path d="M30 82h160M30 108h160M30 134h160M84 56v104M137 56v104"/>
        </g>
        <rect x="90" y="88" width="40" height="14" fill="#ffe3a3"/>
        <rect x="37" y="114" width="40" height="14" fill="#ffe3a3"/>
        <rect x="143" y="140" width="40" height="14" rx="2" fill="#f08a24"/>
        <path d="M150 40l8 8 8-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0"/>
        <text x="46" y="48" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#fff">A</text>
        <text x="103" y="48" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#fff">B</text>
        <text x="156" y="48" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#fff">C</text>
      </svg>
    </div>
    <figcaption class="cap">Facts you can verify</figcaption>
  </figure>

  <!-- Card 4: Slides / chart -->
  <figure class="card c4">
    <div class="art">
      <svg viewBox="0 0 280 220">
        <rect x="40" y="30" width="200" height="130" rx="8" fill="#fff" stroke="#4a6fe0" stroke-width="4"/>
        <rect x="58" y="48" width="70" height="8" rx="4" fill="#4a6fe0"/>
        <rect x="58" y="64" width="50" height="6" rx="3" fill="#b4c9ff"/>
        <rect x="150" y="100" width="16" height="40" rx="2" fill="#b4c9ff"/>
        <rect x="172" y="84" width="16" height="56" rx="2" fill="#7f9df0"/>
        <rect x="194" y="68" width="16" height="72" rx="2" fill="#4a6fe0"/>
        <rect x="58" y="100" width="70" height="40" rx="4" fill="#dfe8ff"/>
        <path d="M130 160v30M110 190h40" stroke="#4a6fe0" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </figure>

  <!-- Card 5: Signature / shared -->
  <figure class="card c5">
    <div class="art">
      <svg viewBox="0 0 240 240">
        <rect x="50" y="30" width="110" height="150" rx="8" fill="#fff" stroke="#e0607c" stroke-width="4"/>
        <rect x="64" y="50" width="60" height="6" rx="3" fill="#e0607c"/>
        <rect x="64" y="66" width="80" height="6" rx="3" fill="#f6b3c2"/>
        <rect x="64" y="82" width="70" height="6" rx="3" fill="#f6b3c2"/>
        <path d="M64 150c10-20 16 10 26-6s12 8 22-2" stroke="#e0607c" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- pen -->
        <g transform="translate(150 110) rotate(35)">
          <rect x="0" y="0" width="14" height="80" rx="3" fill="#3a2a22"/>
          <path d="M0 80h14l-7 16z" fill="#f08a24"/>
        </g>
        <!-- share icon -->
        <circle cx="170" cy="60" r="22" fill="#e0607c"/>
        <g stroke="#fff" stroke-width="3" fill="#fff" stroke-linecap="round">
          <circle cx="178" cy="52" r="4"/><circle cx="162" cy="60" r="4"/><circle cx="178" cy="68" r="4"/>
          <path d="M165 58l10-5M165 62l10 5" fill="none"/>
        </g>
      </svg>
    </div>
    <figcaption class="cap">Review &amp; approve</figcaption>
  </figure>

  <!-- Center content -->
  <p class="eyebrow">BRAND-SAFE COPY, EVERY TIME</p>
  <svg class="sun" viewBox="0 0 64 48" fill="none" stroke="#f08a24" stroke-width="2.5" stroke-linecap="round">
    <path d="M12 42a20 20 0 0 1 40 0M4 42h56M32 6v8M10 16l6 6M54 16l-6 6M2 30h8M54 30h8"/>
  </svg>
  <h1>Write boldly.<span class="accent">Ship safely.</span></h1>
  <p class="sub">Check ad copy against your brand rules and facts.<br />Catch problems before they go live.</p>
  <a href="#" class="btn-primary">Check your text
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 10 10 2M4 2h6v6"/></svg>
  </a>
</main>

</body>
</html>
